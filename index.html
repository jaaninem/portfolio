<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Janine Agbayani</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Scrollable Thumbnail Gallery (Left Sidebar) -->
        <div class="main-component" id="gallery-container">
            <span class="hidden" id="about-text">
				Janine Agbayani is a Filipino-Swiss photographer based in Lausanne, Switzerland. She is currently finishing her Bachelor's at ECAL.<br>
				<br>
				contact:<br>
				<a href="mailto:janineme.agbayani@gmail.com">janineme.agbayani@gmail.com</a><br>
				instagram:<br>
				<a href="https://instagram.com/jaanin_ea">@jaanin_ea</a><br>
				<br>
				Website coded by Anoush Azar-Pey<br>
            </span> 
			<div id="gallery-nav" class="gallery-nav">
				<button id="about" class="gallery-nav-btn about-btn">About</button>
				<div id="gallery-buttons" class="gallery-buttons"></div>
			</div>
			<div class="bottom-text">
				<div class="hidden" id="back">Back</div>
			</div>
            <div id="cursor-line"></div>

                <div id="project-gallery"> 
                    <!-- Generated by JavaScript -->
                </div>
        </div>

        <!-- Main Photo Display (Sticky Section) -->
        <div class="main-component" id="main-display">
            <div id="image-container">
                <img id="featured-image" src="" alt="Featured Photo">
                <div id="project-end-text" class="hidden"></div>
            </div>
            <!-- Neighbour photo peeks: strips of faint thumbnails for the adjacent
                 slides, filled and positioned by script.js in the white gutter -->
            <div class="peek-strip peek-strip-prev" id="prev-peeks" role="group" aria-label="Previous photos"></div>
            <div class="peek-strip peek-strip-next" id="next-peeks" role="group" aria-label="Next photos"></div>
            <div id="photo-info">
                <div class="counter" id="image-counter"></div>
                <p id="photo-description"></p>
            </div>
        </div>
    </div>

    <script src="galleries/galleries.js"></script>
    <script src="assets/scripts/script.js"></script>
</body>
</html>
