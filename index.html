<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Janine Agbayani</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Scrollable Thumbnail Gallery (Left Sidebar) -->
        <div class="main-component" id="gallery-container">
            <span class="hidden" id="about-text">
                 Janine Agbayani is a Filipino-Swiss photographer based in Lausanne, Switzerland. She is currently finishing her Bachelor's at ECAL.
	
	contact:
	janineme.agbayani@gmail.com
	instagram:
	@jaanin_ea
	
	Website coded by Anoush Azar-Pey
            </span> 
            <div id="name"><span>Janine Agbayani</span></div>
            <div id="about"><span>About</span></div>
            <div class="hidden" id="back">Back</div>
            <div id="cursor-line"></div>

                <div id="project-gallery"> 
                    <!-- Generated by JavaScript -->
                </div>
        </div>

        <!-- Main Photo Display (Sticky Section) -->
        <div class="main-component" id="main-display">
            <div id="image-container">
                <img id="featured-image" src="" alt="Featured Photo">
                <div id="project-end-text" class="hidden"></div>
            </div>
            <div class="navigation">
                <button class="nav-btn" id="prev-btn">
                    <img src="assets/icons/alt-arrow-left-svgrepo-com.svg" alt="Previous" width="24" height="24">
                </button>
                <button class="nav-btn" id="next-btn">
                    <img src="assets/icons/alt-arrow-right-svgrepo-com.svg" alt="Previous" width="24" height="24">
                </button>
            </div>
            <div id="photo-info">
                <div class="counter" id="image-counter"></div>
                <p id="photo-description"></p>
            </div>
        </div>
    </div>

    <script src="assets/scripts/script.js"></script>
</body>
</html>
